{% extends "base.html" %}

{% block content %}
<div class="profile-books-review-container">
    <h1 id="review-list-title" style="color:#29436d; margin-bottom:1.5rem;"></h1>
    <div class="books-grid" id="books-review-grid">
        <!-- Las tarjetas de libros se insertan aquí por JS -->
    </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/book_review.css') }}">
<script src="{{ url_for('static', filename='js/book_review.js') }}"></script>

<!-- Modal para reseñar -->
<div id="review-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Reseñar libro</h2>
        <div id="modal-book-info"></div>
        <textarea id="review-text" placeholder="Escribe tu reseña..." style="width:100%;height:90px;margin:1em 0;"></textarea>
        <div style="margin-bottom:1em;">
            <label for="review-rating">Calificación:</label>
            <select id="review-rating">
                <option value="">Sin calificar</option>
                {% for i in range(1,6) %}
                <option value="{{i}}">{{i}} ⭐</option>
                {% endfor %}
            </select>
        </div>
        <button id="save-review-btn" class="btn primary-btn">Guardar reseña</button>
    </div>
</div>
{% endblock %}
