{% extends "base.html" %}

{% block content %}
<div class="book-info-container" style="display: flex; gap: 2.5rem; align-items: flex-start; max-width: 1100px; margin: 2rem auto;">
    <!-- Columna izquierda: Portada y acciones -->
    <div class="book-info-left" style="min-width: 220px; display: flex; flex-direction: column; align-items: center;">
        <div class="book-cover-large" style="width: 200px; height: 300px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px #29436d22; background: #e9ecef;">
            <img src="{{ book.portada if book.portada else '/static/img/default_cover.webp' }}" alt="Portada de {{ book.titulo }}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div style="margin-top: 2rem; width: 100%;">
            <div class="dropdown" style="position: relative; width: 100%;">
                <button class="btn" style="
                    width: 100%;
                    border-radius: 12px;
                    font-weight: 500;
                    font-size: 1.1em;
                    padding: 0.7em 0;
                    background-color: #4a6fa5;
                    color: white;
                    border: none;
                    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
                    cursor: pointer;
                    transition: background-color 0.2s ease;
                ">
                    Quiero Leer <i class="ri-arrow-down-s-line"></i>
                </button>
                <div class="dropdown-menu" style="
                    display: none;
                    position: absolute;
                    left: 0;
                    top: 110%;
                    width: 100%;
                    background: white;
                    border-radius: 12px;
                    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
                    z-index: 10;
                    overflow: hidden;
                ">
                    <a href="#" class="dropdown-item" style="display: flex; align-items: center; gap: 0.7em; padding: 0.8em 1.2em; color: #29436d; text-decoration: none; font-size: 0.95em;">
                        <i class="ri-bookmark-line" style="font-size: 1.1em;"></i> Por leer
                    </a>
                    <a href="#" class="dropdown-item" style="display: flex; align-items: center; gap: 0.7em; padding: 0.8em 1.2em; color: #29436d; text-decoration: none; font-size: 0.95em;">
                        <i class="ri-book-open-line" style="font-size: 1.1em;"></i> Leyendo
                    </a>
                    <a href="#" class="dropdown-item" style="display: flex; align-items: center; gap: 0.7em; padding: 0.8em 1.2em; color: #29436d; text-decoration: none; font-size: 0.95em;">
                        <i class="ri-checkbox-circle-line" style="font-size: 1.1em;"></i> Leído
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Columna derecha: Info principal -->
    <div class="book-info-main" style="flex: 1 1 0; position: relative;">
        <!-- Favorito -->
        <div style="position: absolute; top: 0; right: 0;">
            <span class="favorite-icon" style="cursor: pointer; position: relative;">
                <i class="ri-heart-line" style="font-size: 2.1rem; color:#ff69b4;"></i>
            </span>
        </div>
        <h1 style="margin-top: 0; color: #29436d;">{{ book.titulo }}</h1>
        <h3 style="margin: 0 0 1.2rem 0; color: #4a6fa5; font-weight: 500;">{{ book.autor }}</h3>
        <div class="book-summary" style="margin-bottom: 1.5rem; color: #43494e; font-size: 1.08em;">
            {{ book.resumen }}
        </div>
        <div class="book-genres" style="margin-bottom: 1.5rem;">
            {% for genero in book.generos %}
                <span style="background: #e9ecef; color: #29436d; border-radius: 4px; padding: 4px 14px; font-size: 1em; margin-right: 8px;">{{ genero }}</span>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Otros libros -->
<div class="other-books-section" style="margin: 3rem auto 1rem auto; max-width: 1100px;">
    <h2 style="color: #29436d; margin-bottom: 1.2rem;">Otros libros que podrían gustarte</h2>
    <div class="other-books-list" id="otros-libros-list" style="display: flex; gap: 2.2rem; overflow-x: auto; padding-bottom: 1rem; align-items: flex-start;">
        <!-- Los libros similares se insertan aquí por JS -->
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Dropdown para "Quiero Leer"
    const dropdown = document.querySelector('.dropdown');
    if (dropdown) {
        const btn = dropdown.querySelector('button');
        const menu = dropdown.querySelector('.dropdown-menu');
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', function(e) {
            if (!dropdown.contains(e.target)) menu.style.display = 'none';
        });
    }
    // Tooltip favorito: verifica existencia de .tooltip
    const favIcon = document.querySelector('.favorite-icon');
    if (favIcon) {
        favIcon.addEventListener('mouseenter', function() {
            const tooltip = favIcon.querySelector('.tooltip');
            if (tooltip) tooltip.style.visibility = 'visible';
        });
        favIcon.addEventListener('mouseleave', function() {
            const tooltip = favIcon.querySelector('.tooltip');
            if (tooltip) tooltip.style.visibility = 'hidden';
        });
    }

    // --- Interacción usuario-libro ---
    const bookId = "{{ book.id }}";
    const token = localStorage.getItem('token');
    const heartIcon = document.querySelector('.favorite-icon i');
    const statusItems = document.querySelectorAll('.dropdown-item');
    let interaction = null;

    function showMessage(msg) {
        let m = document.createElement('div');
        m.textContent = msg;
        m.style.position = 'fixed';
        m.style.top = '30px';
        m.style.right = '30px';
        m.style.background = '#4a6fa5';
        m.style.color = '#fff';
        m.style.padding = '0.7em 1.5em';
        m.style.borderRadius = '10px';
        m.style.zIndex = 9999;
        m.style.fontWeight = 'bold';
        document.body.appendChild(m);
        setTimeout(() => m.remove(), 1800);
    }

    function updateUI() {
        // Favorito
        if (interaction && interaction.is_favorite) {
            heartIcon.classList.remove('ri-heart-line');
            heartIcon.classList.add('ri-heart-fill');
            heartIcon.style.color = '#ff69b4';
        } else {
            heartIcon.classList.remove('ri-heart-fill');
            heartIcon.classList.add('ri-heart-line');
            heartIcon.style.color = '#ccc';
        }
        // Estado
        statusItems.forEach(item => {
            item.style.background = '#fff';
            item.style.color = '#29436d';
            item.style.textDecoration = 'none';
            if (interaction && item.textContent.trim().toLowerCase() === estadoToText(interaction.status)) {
                item.style.background = '#e9ecef';
                item.style.color = '#2563eb';
                item.style.fontWeight = 'bold';
            } else {
                item.style.fontWeight = 'normal';
            }
        });
    }
    function estadoToText(status) {
        if (status === 'to-read') return 'por leer';
        if (status === 'reading') return 'leyendo';
        if (status === 'completed') return 'leído';
        return '';
    }
    function textToEstado(text) {
        text = text.toLowerCase();
        if (text === 'por leer') return 'to-read';
        if (text === 'leyendo') return 'reading';
        if (text === 'leído') return 'completed';
        return '';
    }
    // Cargar interacción
    if (token) {
        fetch(`/interactions/${bookId}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
            if (data) interaction = data;
            updateUI();
        })
        .catch(() => { interaction = null; updateUI(); }); // Maneja 404 correctamente
    }
    // Click en favorito
    if (heartIcon) {
        heartIcon.addEventListener('click', function() {
            if (!token) { window.location.href = '/login'; return; }
            const isFav = !(interaction && interaction.is_favorite);
            const method = interaction ? 'PATCH' : 'POST';
            const url = interaction ? `/interactions/${bookId}` : '/interactions/';
            const body = interaction ? { is_favorite: isFav } : { book_id: bookId, is_favorite: isFav };
            fetch(url, {
                method,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })
            .then(async r => {
                if (!r.ok) {
                    const err = await r.json().catch(() => ({}));
                    showMessage(err.detail || 'Error al actualizar favorito');
                    return null;
                }
                return r.json();
            })
            .then(data => {
                if (data) {
                    interaction = data;
                    updateUI();
                    showMessage(isFav ? 'Agregado a favoritos' : 'Quitado de favoritos');
                }
            });
        });
    }
    // Click en estado
    statusItems.forEach(item => {
        item.addEventListener('click', function(e) {
            if (!token) { window.location.href = '/login'; return; }
            const estado = textToEstado(item.textContent.trim());
            if (!estado) return;
            const method = interaction ? 'PATCH' : 'POST';
            const url = interaction ? `/interactions/${bookId}` : '/interactions/';
            const body = interaction ? { status: estado } : { book_id: bookId, status: estado };
            fetch(url, {
                method,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })
            .then(async r => {
                if (!r.ok) {
                    const err = await r.json().catch(() => ({}));
                    showMessage(err.detail || 'Error al actualizar estado');
                    return null;
                }
                return r.json();
            })
            .then(data => {
                if (data) {
                    interaction = data;
                    updateUI();
                    showMessage('Estado actualizado');
                }
            });
        });
    });

    // Cargar libros similares dinámicamente
    fetch(`/books/${bookId}/similares`)
        .then(resp => resp.json())
        .then(data => {
            const cont = document.getElementById('otros-libros-list');
            cont.innerHTML = '';
            if (data.length === 0) {
                cont.innerHTML = '<span style="color: #b0b0b0;">No hay recomendaciones similares.</span>';
            } else {
                data.forEach(other => {
                    cont.innerHTML += `
                    <div class="other-book-card" style="min-width: 160px; max-width: 160px; display: flex; flex-direction: column; align-items: center;">
                        <div style="width: 130px; height: 200px; border-radius: 10px; overflow: hidden; background: #e9ecef; box-shadow: 0 2px 10px #29436d22; display: flex; align-items: center; justify-content: center;">
                            <img src="${other.portada || '/static/img/default_cover.webp'}" alt="Portada de ${other.titulo}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div style="margin-top: 0.7em; text-align: center; width: 100%;">
                            <a href="/books/${other.id}" style="font-size: 1em; color: #29436d; text-decoration: none; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; max-width: 140px; min-height: 2.5em; line-height: 1.2em;">${other.titulo}</a>
                        </div>
                    </div>`;
                });
            }
        });
});
</script>
<style>
.other-books-list::-webkit-scrollbar {
    height: 10px;
}
.other-books-list::-webkit-scrollbar-thumb {
    background: #e9ecef;
    border-radius: 6px;
}
.other-book-card a {
    word-break: break-word;
    text-decoration: none;
}
.dropdown-menu .dropdown-item:hover {
    background: #e3eaf7;
    color: #3571c9;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
}
</style>
{% endblock %}
